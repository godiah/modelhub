# Host nginx config for ModelHub
# Replace modelhub.example.com with the real production domain before first deploy.
# It proxies traffic to the dockerized nginx container on port 8080.
#
# HTTP-only on purpose: Certbot's nginx plugin (`certbot --nginx`, not
# `certonly`, see server-setup.sh) edits this file in place after obtaining
# the certificate — it adds the `listen 443 ssl` server block itself, with
# correct ssl_certificate paths, and the 80->443 redirect via --redirect.
# Shipping a pre-written 443 block here would fail nginx -t before Certbot
# ever runs, since the referenced cert files don't exist yet on first boot.

server {
    listen 80;
    listen [::]:80;
    server_name modelhub.example.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to the Docker nginx container (Certbot inserts the HTTPS
    # equivalent of this block into a new 443 server block after this file
    # is in place and the certificate exists)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (needed for Reverb/Soketi/Pusher)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        # Buffer size for large responses
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # Logging
    access_log /var/log/nginx/modelhub.access.log;
    error_log /var/log/nginx/modelhub.error.log;
}
