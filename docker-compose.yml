# Local Development Docker Compose — ModelHub
#
# Usage:
#   docker compose up -d                          # core services
#   docker compose --profile dev-tools up -d      # include Mailpit + phpMyAdmin
#
# First-time setup:
#   cp .env.example .env && php artisan key:generate
#   docker compose up -d --build
#   docker compose exec laravel.test composer install
#   docker compose exec laravel.test php artisan migrate

x-common-depends: &common-depends
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy

services:

  laravel.test:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: modelhub/app
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    entrypoint: []
    command: php-fpm
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - '.:/var/www/html'
      - './docker/php/php-dev.ini:/usr/local/etc/php/conf.d/php-dev.ini'
    networks:
      sail:
        aliases:
          - app
    restart: unless-stopped
    depends_on:
      <<: *common-depends
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z 127.0.0.1 9000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: modelhub/nginx
    ports:
      - '${APP_PORT:-8094}:80'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    restart: unless-stopped
    depends_on:
      laravel.test:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: modelhub/app
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    entrypoint: []
    command: php artisan schedule:work
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    restart: unless-stopped
    depends_on:
      <<: *common-depends
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: modelhub/app
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    entrypoint: []
    command: php artisan queue:work --tries=3 --backoff=5
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    restart: unless-stopped
    depends_on:
      <<: *common-depends
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mysql:
    image: 'mysql:8.4'
    ports:
      - '${FORWARD_DB_PORT:-3311}:3306'
    environment:
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_ALLOW_EMPTY_PASSWORD: '1'
    volumes:
      - 'sail-mysql:/var/lib/mysql'
      - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
    networks:
      - sail
      - dbtools
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: 'redis:8-alpine'
    command: redis-server --appendonly yes
    ports:
      - '${FORWARD_REDIS_PORT:-6384}:6379'
    volumes:
      - 'sail-redis:/data'
    networks:
      - sail
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '${FORWARD_MAILPIT_PORT:-52028}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8029}:8025'
    networks:
      - sail
    profiles:
      - dev-tools
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  phpmyadmin:
    image: 'phpmyadmin:5.2'
    ports:
      - '${FORWARD_PHPMYADMIN_PORT:-8093}:80'
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: '${DB_PASSWORD}'
    networks:
      - sail
    profiles:
      - dev-tools
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  sail:
    driver: bridge
  dbtools:
    external: true

volumes:
  sail-mysql:
    driver: local
  sail-redis:
    driver: local
